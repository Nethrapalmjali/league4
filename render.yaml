services:
  - type: web
    name: gml-s4-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PING_INTERVAL
        value: "15"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
