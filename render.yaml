services:
  - type: web
    name: gmlweb
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: nandu
      - key: ADMIN_PASSWORD
        value: Mkan@6767
      - key: PING_INTERVAL
        value: "15"
      - key: KEEP_ALIVE_ENABLED
        value: "true"
