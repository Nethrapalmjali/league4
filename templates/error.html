{% extends "base.html" %}

{% block title %}{{ title }} · Error {{ code }}{% endblock %}

{% block container_class %}container container--narrow{% endblock %}

{% block content %}
<section class="panel" style="text-align: center; padding: 4rem 2rem;">
  <div style="font-size: 5rem; color: var(--danger); margin-bottom: 1.5rem;">⚠️</div>
  <h2 style="color: var(--maroon);">{{ title }}</h2>
  <p style="margin-top: 1rem; color: var(--muted); font-size: 1.1rem; line-height: 1.6;">
    {{ message }}
  </p>
  <div style="margin-top: 3rem;">
    <a href="{{ url_for('index') }}" class="btn btn--primary">Return to Homepage</a>
  </div>
</section>
{% endblock %}
